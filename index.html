<!DOCTYPE html>
<html lang="ar" dir="rtl">

            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px;
        }
        .container {
            max-width: 1000px; width: 100%; background: rgba(255, 255, 255, 0.98);
            padding: 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-top: 8px solid #8B0000; box-sizing: border-box;
        }
        h2 { text-align: center; color: #8B0000; font-size: 26px; margin-bottom: 20px; font-weight: 900; }
        .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 15px; color: #333; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #bbb; font-family: 'Cairo'; font-size: 14px; box-sizing: border-box; }
        select[multiple] { height: 350px; }
        .info-box { background: #fff5f5; border: 2px solid #8B0000; border-radius: 12px; padding: 15px; height: fit-content; position: sticky; top: 10px; }
        .fine-manual-box { background: #fff0f0; padding: 10px; border-radius: 10px; border: 1px solid #8B0000; margin-top: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-gen { background: #8B0000; } .btn-copy { background: #2e7d32; }
        .output { margin-top: 25px; padding: 20px; background: #fdfdfd; border: 2px dashed #8B0000; border-radius: 10px; white-space: pre-wrap; font-size: 15px; font-weight: 700; color: #222; text-align: right; line-height: 1.6; }

</head>

    <h2>📋 لوحة تحكم مخالفات الهلال الأحمر</h2>
    <div class="layout">
        <div class="main-side">
            <div class="form-group">
                <label> كوبي يوزر المسعف:</label>
                <input id="id" type="number" placeholder="197860519980302337 مثال...">
            </div>
            <div class="form-group">
                <label>👨‍⚕️ اسم المسعف وكوده (للفصل فقط):</label>
                <input id="rescuerName" placeholder=" محمد الصواف[E-248]  ...">
            </div>
            <div class="form-group">
                <label>🔍 بحث سريع:</label>
                <input id="search" placeholder="ابحث عن المخالفة..." onkeyup="filterList()">
            </div>
            <div class="form-group">
                <label>🚫 قائمة المخالفات (اختيار متعدد):</label>
                <select id="violation" multiple onchange="updateUI()"></select>
            </div>
        </div>

        <div class="info-box">
            <span style="color:#8B0000; font-weight:900;">⚖️ الجزاء المقرر حرفياً</span>
            <hr>
            <div id="hover-info">اختر مخالفة لعرض التفاصيل...</div>
            <div class="fine-manual-box">
                <label style="color: #8B0000;">💰 إجمالي الغرامة:</label>
                <input id="totalFineManual" type="number" placeholder="المبلغ المالي...">
            </div>
        </div>
    </div>

    <div class="layout" style="grid-template-columns: 1fr 1fr; margin-top:15px;">
        <div class="form-group" id="levelGroup">
            <label>📊 درجة الإنذار:</label>
            <select id="level">
                <option value="شـفـهـي ">إنذار شـفـهـي </option>
                <option value="أول" selected>إنذار أول</option>
                <option value="ثاني">إنذار ثاني</option>
                <option value="نهائي بالفصل">إنذار نهائي بالفصل </option>
            </select>
        </div>
        <div class="form-group">
            <label>✍️ توقيع المسؤول:</label>
            <select id="signature">
                <option value="field">اشراف ميداني</option>
                <option value="general">اشراف عام</option>
                <option value="deputy">نائب مساعد القائد</option>
                <option value="cdeputy">مساعد القائد</option>
                <option value="bdeputy">نائب القائد</option>
				<option value="bddeputy">كبار المشرفين</option>
                <option value="adeputy">قائد الهلال الاحمر</option>
            </select>
        </div>
    </div>

<div class="btn-group">
        <button class="btn-gen" onclick="generate()">تجهيز التقرير النهائي</button>
        <button class="btn-copy" onclick="copyText()">نسخ القرار للديسكورد</button>
    </div>

    <div id="out" class="output"></div>

    <div style="margin-top: 25px; text-align: center; border-top: 1px solid #ddd; padding-top: 15px; color: #555; font-size: 13px;">

            <span>👨‍⚕️ المسعف / محمد الصواف</span>
        </div>
    </div>
</div>

    "التواجد في روم العمليات اكثر من 2 دقائق": { fine: 200000, penalty: "انـذار اول + غرامة بقيمة 200 الف", autoLevel: "اول" }
};


const signatures = { 
    field: "<@&1071933366934458489>", general: "<@&1164572574391476264>", deputy: "<@&1153823182281777293>", 
    cdeputy: "<@&1092667422902862004>", bdeputy: "<@&1071933358503903242>", adeputy: "<@&1071933359086911561>"  , bddeputy:"<@&1196864372044210267>"
};

function loadList(list){
    const select = document.getElementById("violation"); select.innerHTML = "";
    Object.keys(list).forEach(k => {
        let opt = document.createElement("option"); opt.value = k; opt.textContent = k;
        opt.onclick = () => document.getElementById("hover-info").innerHTML = `<b>⚖️ الجزاء المقرر:</b><br>${list[k].penalty}`;
        select.appendChild(opt);
    });
}
loadList(data);

function filterList(){
    let q = document.getElementById("search").value.toLowerCase();
    let res = {}; for(let k in data) if(k.toLowerCase().includes(q)) res[k] = data[k];
    loadList(res);
}

function updateUI(){
    let sel = Array.from(document.getElementById("violation").selectedOptions).map(o => o.value);
    if(!sel.length) return;
    let autoTotal = 0;
    sel.forEach(v => { if(data[v]) autoTotal += data[v].fine; });
    document.getElementById("totalFineManual").value = autoTotal;
    let isFasl = sel.some(v => data[v].type === "فصل");
    document.getElementById("levelGroup").style.display = isFasl ? "none" : "block";
}

function generate() {
    let idValue = document.getElementById("id").value.trim();
    let nameValue = document.getElementById("rescuerName").value.trim();
    let sel = Array.from(document.getElementById("violation").selectedOptions).map(o => o.value);
    let lv = document.getElementById("level").value.trim(); 
    let finalFine = document.getElementById("totalFineManual").value;

    if(!idValue) return alert("❌ الـ Discord ID مطلوب!");
    if(!sel.length) return alert("❌ اختر مخالفة!");

    let isFasl = sel.some(v => data[v].type === "فصل");
    let hasPromoDelay = sel.some(v => data[v].penalty.includes("تأخير ترقية"));
    let hasRankBreak = sel.some(v => data[v].penalty.includes("كسر رتبة"));
    let hasConfiscation = sel.some(v => data[v].penalty.includes("سحب الممنوعات"));
    
    let penaltyResult = "";

    if (isFasl) {
        let faslParts = ["فصل من القطـاع", "غرامة مالية بقيمة ( 1,000,000 )", "منع من التوظيف 14 يوم"];
        if (sel.some(v => data[v].penalty.includes("نهائي من الهلال الاحمر"))) faslParts.push("نهائي من الهلال الاحمر");
        if (sel.some(v => data[v].penalty.includes("باند نهائي"))) faslParts.push("باند نهائي");
        if (sel.some(v => data[v].penalty.includes("سجن"))) faslParts.push("سجن نهائي");
        penaltyResult = faslParts.join(" + ");
    } 
    else if (lv === "شـفـهـي") {
        penaltyResult = "انـذار شـفـهـي";
    } 
    else {
        let parts = [];
        parts.push(`انـذار ${lv}`);
        if (hasRankBreak) parts.push("كسر رتبة");
        if (hasPromoDelay) parts.push("تأخير ترقية");
        
        if (Number(finalFine) > 0) {
            let formattedFine = Number(finalFine).toLocaleString();
            parts.push(`غرامة مالية بقيمة ( ${formattedFine} )`);
        }
        if (hasConfiscation) parts.push("سحب الممنوعات");
        penaltyResult = parts.join(" + ");
    }

    let personSection = isFasl ? `<@${idValue}>\n${nameValue}` : `<@${idValue}>`;
    let warning = (!isFasl && lv !== "شـفـهـي" && Number(finalFine) > 0) ? "\n`مهلة 24 ساعة لفتح تكت مساعدة من القيادة للسداد تجنباً لتدبيلها`" : "";

    // التحكم في المسافة قبل "توقيع" فقط
    let signatureSpacing = (lv === "شـفـهـي" || isFasl) ? "\n\n" : "\n\n\n";

    let out = `***قرار صادر من <@&1071933370407325807>    ينص على :


${penaltyResult}  للــمــســعـــف :


${personSection}


\`وذلك بسبب ( ${sel.join(" + ")} )\`
${warning}${signatureSpacing}توقـيـع :
${signatures[document.getElementById("signature").value]} 


إعتماد 
<@&1071933358503903242> 
<@813079786855464961>   

<@&1071933359086911561>***
<@1162195276514197527>`;

    document.getElementById("out").innerText = out;
}

function copyText(){ 
    const text = document.getElementById("out").innerText;
    if(!text) return alert("جهز التقرير أولاً!");
    navigator.clipboard.writeText(text).then(() => alert("تم النسخ بنجاح ✅")); 
}
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

document.addEventListener('keydown', function(e) {
  if (
    (e.ctrlKey && e.key.toLowerCase() === 'u') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
    (e.ctrlKey && e.key.toLowerCase() === 's')
  ) {
    e.preventDefault();
  }
});
